<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- Only same-origin requests (the game files built by npm run port) are allowed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; form-action 'none'"
    />
    <title>zelda-oot-js</title>
    <style>
      body { margin: 0; background: #000; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
      #app { position: relative; height: 100dvh; overflow: hidden; --rail: 40px; }
      /* The picture takes the whole window but the folded panel's strip: the largest 4:3 rectangle, centred. */
      #main { position: absolute; inset: 0 var(--rail) 0 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; width: min(calc(100vw - var(--rail)), calc(100dvh * 4 / 3)); flex: none; }
      canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; }
      canvas.native { image-rendering: pixelated; }
      #overlay { position: absolute; top: 0; left: 0; margin: 0; padding: 6px 8px; background: rgba(0, 0, 0, 0.7); color: #8f8; font: 12px/1.3 ui-monospace, monospace; pointer-events: none; white-space: pre; }
      #overlay[hidden] { display: none; }
      #notice { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 4px 12px; background: rgba(0, 0, 0, 0.75); color: #fff; border-radius: 4px; pointer-events: none; }
      #notice[hidden] { display: none; }
      #status { position: absolute; top: 4px; left: 8px; z-index: 3; padding: 2px 6px; background: rgba(0, 0, 0, 0.6); border-radius: 3px; }
      #status:empty, #status.ok { display: none; }
      #status.error { color: #f88; }

      /* The panel: a strip on the right on a desktop that opens over the picture, a sheet behind the menu button on touch devices. */
      #dock { position: absolute; top: 0; right: 0; bottom: 0; z-index: 4; width: var(--dock-width, 360px); display: flex; background: rgba(24, 24, 24, 0.96); border-left: 1px solid #333; }
      #dock.folded { width: 40px; }
      #dock-resizer { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; touch-action: none; z-index: 1; }
      #dock-resizer:hover { background: rgba(255, 255, 255, 0.12); }
      .rail { display: flex; flex-direction: column; width: 100%; }
      .rail button { height: 40px; padding: 0; background: none; border: 0; color: #ddd; font-size: 16px; cursor: pointer; }
      .rail button:hover, .tabs button:hover { background: #262626; }
      .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .tabs { display: flex; border-bottom: 1px solid #333; }
      .tabs button { flex: 1; padding: 8px 4px; background: none; border: 0; border-bottom: 2px solid transparent; color: #aaa; font: inherit; cursor: pointer; }
      .tabs button.active { color: #fff; border-bottom-color: #4a8; }
      .tabs .fold { flex: none; width: 36px; }
      .tab-body { flex: 1; overflow: auto; padding: 10px 12px; }
      .tab section { margin-bottom: 14px; }
      .tab h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #999; }
      .tab button { font: inherit; font-size: 12px; padding: 4px 8px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 3px; cursor: pointer; }
      .tab button[aria-pressed="true"] { background: #264; border-color: #4a8; }
      .tab button:disabled { opacity: 0.4; cursor: default; }
      .tab label { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; }
      .tab input[type="range"] { flex: 1; min-width: 0; vertical-align: middle; }
      .tab output { width: 3.5em; text-align: right; color: #999; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
      .hint, .help { margin: 6px 0 0; font-size: 12px; color: #999; }
      .note { font-size: 12px; color: #fc8; }
      .note[hidden] { display: none; }
      .tab input[type="text"].num { flex: none; }
      .tab input[type="text"] { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 4px 6px; background: #111; color: #ddd; border: 1px solid #444; border-radius: 3px; }
      .warp .slots td .note { color: #999; }
      .slots { width: 100%; border-collapse: collapse; }
      .slots td { padding: 3px 4px 3px 0; }
      .slots tr.current td:first-child { border-left: 2px solid #4a8; padding-left: 4px; }
      .hex { font: 11px/1.5 ui-monospace, monospace; margin-top: 6px; overflow-x: auto; }
      .hexrow { display: flex; gap: 6px; white-space: pre; }
      .hexrow .addr, .memory .addr { color: #999; font: 11px ui-monospace, monospace; }
      .cell { cursor: pointer; padding: 0 1px; border-radius: 2px; }
      .cell.changed { background: #a63; color: #fff; }
      .cell.picked { outline: 1px solid #4a8; }
      .memory select, .memory textarea { font: inherit; font-size: 12px; background: #111; color: #ddd; border: 1px solid #444; border-radius: 3px; }
      .memory textarea { display: block; box-sizing: border-box; width: 100%; margin: 6px 0; font-family: ui-monospace, monospace; resize: vertical; }
      .memory .row { align-items: center; margin-top: 6px; }
      .memory .code { color: #999; font: 11px ui-monospace, monospace; overflow-wrap: anywhere; }
      .memory a { color: #8cf; font: 11px ui-monospace, monospace; }
      #debug-text { margin: 8px 0 0; font: 11px/1.3 ui-monospace, monospace; color: #8f8; white-space: pre-wrap; overflow-wrap: anywhere; }
      #menu-button, .touch-only { display: none; }

      /* Touch devices: the picture fills the screen and the panel is a sheet. */
      html.touch { overscroll-behavior: none; touch-action: none; }
      html.touch #app { --rail: 0px; }
      html.touch body { background: #111; height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      html.touch #main { inset: 0; height: 100dvh; align-items: flex-start; }
      html.touch #stage { width: auto; touch-action: none; }
      html.touch canvas { width: 100vw; max-width: 100vw; }
      html.touch #status { position: fixed; padding: 0; background: none; }
      html.touch .keys { display: none; }
      html.touch .touch-only { display: block; }
      html.touch #menu-button { display: block; position: fixed; top: calc(75vw + 65px); left: 50%; transform: translateX(-50%); width: 44px; height: 44px; z-index: 5; padding: 0; font-size: 22px; line-height: 1; color: rgba(255, 255, 255, 0.85); background: none; border: 1.8px solid rgba(255, 255, 255, 0.85); border-radius: 8px; touch-action: manipulation; }
      html.touch #dock { background: #181818; display: none; position: fixed; z-index: 4; top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 60dvh; border-left: 0; border-top: 1px solid #444; touch-action: pan-y; }
      html.touch #dock.open { display: flex; }
      html.touch .tab button, html.touch .tabs button { min-height: 36px; }
      @media (orientation: landscape) {
        html.touch canvas { width: auto; height: 100dvh; max-width: none; }
        html.touch #menu-button { transform: none; top: 112px; left: calc(14px + env(safe-area-inset-left)); }
        html.touch #dock { left: auto; top: 0; height: auto; width: min(360px, 60vw); border-top: 0; border-left: 1px solid #444; }
        html.touch .panel { padding-top: 56px; box-sizing: border-box; }
      }

      #touch-layer { display: none; }
      html.touch #touch-layer { display: block; position: fixed; inset: 0; pointer-events: none; touch-action: none; }
      #touch-layer, #touch-layer * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      html.touch.touch-hidden #touch-layer, html.sheet-open #touch-layer { display: none; }
      #touch-stick { position: absolute; left: 0; top: 30.8%; width: 35.5%; height: 69.2%; pointer-events: auto; touch-action: none; }
      @media (orientation: portrait) { #touch-stick { top: 47.9%; width: 52.6%; height: 49.8%; } }
      .stick-base { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border: 1.8px solid rgba(255, 255, 255, 0.85); border-radius: 50%; }
      .stick-base[hidden] { display: none; }
      .stick-knob { position: absolute; left: 28px; top: 28px; width: 56px; height: 56px; border-radius: 50%; border: 1.8px solid rgba(255, 255, 255, 0.85); background: rgba(255, 255, 255, 0.2); box-sizing: border-box; }
      #touch-buttons { position: absolute; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); pointer-events: none; }
      .touch-button { position: absolute; padding: 0; box-sizing: border-box; border: 1.8px solid rgba(255, 255, 255, 0.85); background: none; color: rgba(255, 255, 255, 0.85); font: bold 16px system-ui, sans-serif; line-height: 1; pointer-events: auto; touch-action: none; }
      .touch-button.circle { border-radius: 50%; }
      .touch-button.shoulder-left { border-radius: 20px 8px 8px 20px; }
      .touch-button.shoulder-right { border-radius: 8px 20px 20px 8px; }
      #touch-start { font-size: 9px; }
      .touch-button.down { background: rgba(255, 255, 255, 0.3); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="main">
        <div id="status">Loading...</div>
        <div id="stage">
          <canvas id="screen"></canvas>
          <pre id="overlay" hidden></pre>
          <div id="notice" hidden></div>
        </div>
      </div>
      <div id="ui-root" style="display: contents"></div>
    </div>
    <div id="touch-layer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
