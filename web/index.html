<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The ROM stays in this page: only same-origin requests (the game's own files) are allowed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; form-action 'none'"
    />
    <title>zelda-oot-js</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
      #stage { position: relative; }
      canvas { display: block; width: 960px; max-width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; }
      #overlay { position: absolute; top: 0; left: 0; margin: 0; padding: 6px 8px; background: rgba(0, 0, 0, 0.7); color: #8f8; font: 12px/1.3 ui-monospace, monospace; pointer-events: none; white-space: pre; }
      #overlay[hidden] { display: none; }
      #status { min-height: 1.4em; }
      #status.error { color: #f88; }
      label.pick { padding: 6px 12px; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
      input[type='file'] { display: none; }
    </style>
  </head>
  <body>
    <label class="pick">Choose ROM (.z64)<input id="rom" type="file" accept=".z64" /></label>
    <div id="status">Pick your own Ocarina of Time (PAL 1.0) ROM. It is read in this page and never uploaded.</div>
    <div id="stage">
      <canvas id="screen"></canvas>
      <pre id="overlay" hidden></pre>
    </div>
    <div>F3: debug overlay &nbsp; C: face culling (normal / swapped / off)</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
